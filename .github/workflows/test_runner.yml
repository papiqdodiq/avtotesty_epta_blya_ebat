name: Run Tests and Generate Report

on:
  push: {}
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-check allure-pytest Faker

    - name: Install Allure
      uses: simple-elf/allure-action@v1
      with:
        version: 2.24.1

    - name: Run tests
      run: |
        python -m pytest module_7/page_object/test_page.py::TestReviewPage::test_review_by_ui -v --alluredir=allure-results
      
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results/
        retention-days: 5

    - name: Generate Allure report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean
        echo "Allure report generated"

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 5
