name: Run Tests and Generate Report

on:
  push: {}
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        playwright install
        playwright install-deps

    - name: Install Allure
      run: |
        sudo apt-get update
        sudo apt-get install default-jre -y
        wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
        tar -zxvf allure-2.29.0.tgz -C /opt/
        sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure
        allure --version

    - name: Create .env file
      run: |
        echo "SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}" >> .env
        echo "SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}" >> .env
        echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
        echo "DBNAME=${{ secrets.DBNAME }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "HOST=${{ secrets.HOST }}" >> .env
        echo "PORT=${{ secrets.PORT }}" >> .env

    - name: Run tests
      run: |
        python -m pytest module_7/page_object/test_page.py::TestReviewPage::test_review_by_ui -v --alluredir=allure-results

    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results/
        retention-days: 5

    - name: Generate Allure report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 5